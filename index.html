/* Дополнительные инструменты и тёмная тема */
.tools-menu{position:relative;z-index:30}
.tools-menu>summary{list-style:none;display:grid;place-items:center;width:35px;height:35px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;cursor:pointer;user-select:none}
.tools-menu>summary::-webkit-details-marker{display:none}
.tools-panel{position:absolute;right:0;top:43px;width:230px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:grid;gap:4px}
.tools-panel button{border:0;border-radius:9px;padding:10px;text-align:left;background:transparent;color:var(--ink);font-size:12px;font-weight:750}
.tools-panel button:hover{background:var(--blue-soft)}
.tools-panel small{padding:7px 10px;color:var(--muted);font-size:10px}
.oral-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 15px 12px}
.oral-timer{border:1px solid var(--line);background:var(--blue-soft);color:#294d83;border-radius:9px;padding:7px 10px;font-size:10px;font-weight:850}

.sprint-track{height:8px;background:#e6ebf3;border-radius:999px;overflow:hidden;margin:14px 0}
.sprint-track i{display:block;height:100%;background:var(--green2);width:0;transition:width .25s}
.sprint-part{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;margin:10px 0;border:1px solid var(--line);border-radius:15px;background:var(--surface)}
.sprint-part h3{margin:0 0 5px;font-size:14px}
.sprint-part p{margin:0;font-size:12px;color:var(--muted)}
.sprint-part .sprint-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.sprint-part.done{border-color:#a8df9d;background:var(--green-soft)}
.sprint-minute{display:inline-flex;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px;font-weight:850;margin-bottom:8px}
.sprint-status{color:var(--muted);font-size:12px}

<script>
'use strict';
const STORE_KEY='tehprog_retake_v4';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const codeBox=code=>`<pre class="codebox"><code>${escapeHtml(code)}</code></pre>`;
const section=(title,html)=>({title,html});
const Q=(id,topic,text,options,correct,explain)=>({id,topic,text,options,correct,explain});
const blocks=[
{id:'b1',number:'01',icon:'⚙️',title:'Язык C# и платформа .NET',short:'Типы, CLR, ввод-вывод, условия и подходы к программированию',source:'Лекция 1 · вопросы 1–3, 31–32',intro:'Разберём, что запускает программу на C#, как вводить данные и как заставлять код принимать решения.',sections:[
section('1. Что такое C# и .NET',`<p><b class="term">C#</b> — язык программирования. На нём описывают алгоритм: какие данные хранить и какие действия выполнить.</p><p><b class="term">.NET</b> — платформа, которая даёт среду выполнения и готовые библиотеки классов. Пример: класс <code class="inline-code">Console</code> для ввода/вывода и <code class="inline-code">List&lt;T&gt;</code> для коллекций.</p><ul><li><b>CLR</b> — среда выполнения .NET: загружает и исполняет управляемый код, предоставляет сборщик мусора и другие сервисы.</li><li><b>CIL / IL</b> — промежуточный язык, в который компилятор переводит исходный C#.</li><li><b>JIT</b> — компилирует IL в машинный код во время выполнения.</li><li><b>Библиотеки .NET</b> — готовые классы и методы.</li></ul><div class="info"><b>Запомни цепочку:</b> исходный C# → компилятор → IL в сборке → CLR/JIT → машинные инструкции процессора.</div>`),
section('2. Что происходит при запуске программы',`<p>Когда проект собирается, исходный код не превращается напрямую в набор инструкций процессора на этапе обычной компиляции C#. Компилятор создаёт сборку с промежуточным кодом и метаданными. При запуске среда .NET обеспечивает выполнение, а JIT-компилятор переводит нужные методы в машинный код.</p><p><b>Управляемый код</b> выполняется под контролем CLR. <b>Неуправляемый код</b> не исполняется CLR как обычный IL-код; при взаимодействии с ним требуется учитывать отдельные правила управления ресурсами.</p><p>В лекции также вводятся понятия кибернетической системы: она получает, хранит и обрабатывает информацию. Система с входными и выходными каналами называется открытой; без обмена с внешней средой — замкнутой. Это общий теоретический контекст курса.</p>`),
section('3. Ввод и вывод через Console',`<p><code class="inline-code">Console.WriteLine()</code> выводит текст и переводит строку; <code class="inline-code">Console.Write()</code> выводит без перевода строки. <code class="inline-code">Console.ReadLine()</code> читает строку из консоли, а не число.</p>${codeBox('Console.Write("Введите возраст: ");\nstring? text = Console.ReadLine();\nif (int.TryParse(text, out int age))\n{\n    Console.WriteLine($"Через год: {age + 1}");\n}\nelse\n{\n    Console.WriteLine("Нужно ввести целое число.");\n}') }<p><b>Parse и TryParse:</b> <code class="inline-code">int.Parse(text)</code> преобразует строку, но выбрасывает исключение при неправильном формате. <code class="inline-code">int.TryParse(text, out int value)</code> возвращает <code class="inline-code">true</code> или <code class="inline-code">false</code> и подходит для проверки пользовательского ввода.</p>`),
section('4. Условия и логические операторы',`<p>Условие <code class="inline-code">if</code> должно иметь значение типа <code class="inline-code">bool</code>: <code class="inline-code">true</code> либо <code class="inline-code">false</code>. Если первая проверка ложная, можно перейти к <code class="inline-code">else if</code>; ветка <code class="inline-code">else</code> срабатывает, если ни одно предыдущее условие не сработало.</p><table class="mini-table"><tr><th>Оператор</th><th>Значение</th><th>Пример</th></tr><tr><td><code>&amp;&amp;</code></td><td>И: оба условия истинны</td><td><code>x &gt; 0 &amp;&amp; x &lt; 10</code></td></tr><tr><td><code>||</code></td><td>ИЛИ: истинно хотя бы одно</td><td><code>n == 1 || n == 2</code></td></tr><tr><td><code>!</code></td><td>НЕ: инверсия</td><td><code>!isReady</code></td></tr><tr><td><code>== / !=</code></td><td>равно / не равно</td><td><code>a == b</code></td></tr></table>${codeBox('if (score >= 90)\n    Console.WriteLine("Отлично");\nelse if (score >= 70)\n    Console.WriteLine("Зачёт");\nelse\n    Console.WriteLine("Нужно повторить");')}<div class="alert"><b>Частая ошибка</b>Не пиши точку с запятой сразу после условия: <code>if (x &gt; 0);</code>. Она создаёт пустую инструкцию, и следующая строка уже не относится к <code>if</code>.</div>`),
section('5. Подходы к программированию',`<p>В первой лекции перечисляются подходы, помогающие организовывать решение:</p><ul><li><b>Процедурный:</b> алгоритм — последовательность процедур и команд.</li><li><b>Модульный:</b> программу разбивают на части с чёткими обязанностями.</li><li><b>Нисходящее проектирование:</b> сначала формулируют общую задачу, затем уточняют её через более мелкие подзадачи.</li><li><b>Программирование с защитой от ошибок:</b> проверяют входные данные и обрабатывают ожидаемые сбои.</li><li><b>Функциональный, логический, параллельный подходы:</b> организуют вычисления соответственно вокруг функций, логических отношений или параллельных действий.</li><li><b>Объектно-ориентированный подход:</b> моделирует предметную область через объекты, данные и поведение.</li></ul><p>Для твоей курсовой важно уметь объяснить модульность и объектный подход: задача, сервис, ViewModel и представление разделены по ролям.</p>`)
],questions:[
Q('b1q1','C# и .NET','Что такое CLR?',['Язык программирования C#','Среда выполнения .NET','Формат JSON','Редактор кода'],1,'CLR — Common Language Runtime. Она обеспечивает выполнение управляемого .NET-кода и предоставляет сервисы вроде сборки мусора.'),
Q('b1q2','C# и .NET','Что обычно находится в сборке после компиляции C#?',['Только исходный текст .cs','Промежуточный IL-код и метаданные','Только команды процессора','Файл базы данных'],1,'Компилятор C# обычно переводит исходный код в промежуточный IL-код внутри сборки.'),
Q('b1q3','Ввод-вывод','Что возвращает Console.ReadLine()?',['Всегда int','Строку или null','Логическое значение','Массив символов char[]'],1,'ReadLine читает строку. Для числа результат нужно преобразовать, например, через TryParse.'),
Q('b1q4','Ввод-вывод','Как безопасно проверить, что введённая строка — целое число?',['int.TryParse','Console.WriteLine','string.Split','File.Exists'],0,'TryParse возвращает bool и не требует использовать исключение как обычный путь проверки неверного ввода.'),
Q('b1q5','Условия','Что означает x > 0 && x < 10?',['x меньше 0 или больше 10','x больше 0 и меньше 10','x равно 0 или 10','условие всегда ложно'],1,'Оператор && требует истинности обеих частей.'),
Q('b1q6','Условия','Что делает точка с запятой в if (x > 0);?',['Открывает блок','Создаёт пустую инструкцию в теле if','Прерывает программу','Обязательно вызывает ошибку компиляции'],1,'После if стоит пустая инструкция; следующая строка выполняется отдельно.'),
Q('b1q7','.NET','Для чего служит JIT?',['Пишет код за программиста','Переводит IL в машинный код при выполнении','Хранит задачи в JSON','Создаёт графические элементы'],1,'JIT — Just-In-Time compiler.'),
Q('b1q8','Подходы к программированию','Что означает модульный подход?',['Весь код в одном методе','Разделение программы на части с отдельными обязанностями','Запрет использовать классы','Запуск без компиляции'],1,'Модули упрощают понимание, тестирование и изменение отдельных частей системы.')
]},
{id:'b2',number:'02',icon:'▦',title:'Массивы, строки и методы',short:'Индексы, циклы, строки, функции и передача параметров',source:'Лекция 2 · вопросы 4–8',intro:'Научимся хранить наборы значений, проходить по ним, обрабатывать текст и понимать, меняет ли метод исходную переменную.',sections:[
section('1. Массивы и индексы',`<p><b class="term">Массив</b> — набор элементов одного типа фиксированной длины. Индексация начинается с нуля.</p>${codeBox('int[] numbers = { 10, 20, 30, 40 };\nConsole.WriteLine(numbers[0]);  // 10\nConsole.WriteLine(numbers.Length); // 4\nConsole.WriteLine(numbers[^1]); // 40 — последний элемент\nnumbers[1] = 25; // заменяем второй элемент') }<p>Если длина равна 4, допустимые индексы — 0, 1, 2, 3. Обращение к индексу за пределами массива приводит к исключению во время выполнения. Оператор <code class="inline-code">^1</code> означает первый элемент с конца.</p><p>Двумерный массив записывают, например, как <code class="inline-code">int[,]</code>, зубчатый — как <code class="inline-code">int[][]</code>. В зубчатом массиве внутренние массивы могут иметь разную длину.</p>`),
section('2. Циклы for и foreach',`<p>Циклы повторяют действия. <code class="inline-code">for</code> удобно использовать, когда нужен индекс или нужно изменять элементы. <code class="inline-code">foreach</code> последовательно перебирает элементы коллекции, обычно без изменения её структуры.</p>${codeBox('int[] nums = { 3, 6, 9 };\nfor (int i = 0; i < nums.Length; i++)\n    Console.WriteLine($"Индекс {i}: {nums[i]}");\n\nforeach (int n in nums)\n    Console.WriteLine(n);\n\nint count = 3;\nwhile (count > 0) { Console.WriteLine(count); count--; }')}<p>Также есть <code class="inline-code">while</code> (проверяет условие до итерации) и <code class="inline-code">do...while</code> (сначала выполняет тело, затем проверяет условие, поэтому тело выполняется хотя бы один раз). <code class="inline-code">break</code> прекращает цикл, <code class="inline-code">continue</code> переходит к следующей итерации.</p>`),
section('3. Строки',`<p><code class="inline-code">string</code> — неизменяемая последовательность символов. Методы, которые будто бы «меняют» строку, возвращают новую строку; исходная строка не мутирует.</p><table class="mini-table"><tr><th>Метод/свойство</th><th>Назначение</th></tr><tr><td><code>Length</code></td><td>Количество символов</td></tr><tr><td><code>Contains</code></td><td>Есть ли фрагмент</td></tr><tr><td><code>StartsWith / EndsWith</code></td><td>Проверка начала / конца</td></tr><tr><td><code>IndexOf</code></td><td>Индекс первого вхождения; обычно -1, если не найдено</td></tr><tr><td><code>Substring</code></td><td>Вырезать часть</td></tr><tr><td><code>Replace</code></td><td>Заменить фрагмент</td></tr><tr><td><code>Trim</code></td><td>Убрать пробельные символы по краям</td></tr><tr><td><code>Split / string.Join</code></td><td>Разбить строку / соединить элементы</td></tr><tr><td><code>ToUpper / ToLower</code></td><td>Изменить регистр в новой строке</td></tr></table>${codeBox('string raw = "  Tom;Sam;Bob  ";\nstring clean = raw.Trim();\nstring[] names = clean.Split(\';\');\nstring joined = string.Join(", ", names);\nConsole.WriteLine(joined); // Tom, Sam, Bob')}`),
section('4. Методы: параметры и return',`<p><b class="term">Метод</b> — именованный блок кода для повторного использования. У него может быть имя, параметры и возвращаемое значение.</p>${codeBox('int Sum(int a, int b)\n{\n    return a + b;\n}\n\nvoid SayHello(string name)\n{\n    Console.WriteLine($"Привет, {name}!");\n}\n\nint doubled = Sum(3, 4); // 7') }<p><code class="inline-code">void</code> означает, что метод не возвращает значение. Оператор <code class="inline-code">return</code> возвращает результат и завершает текущий вызов метода. У параметров могут быть значения по умолчанию: <code class="inline-code">void Print(string name, int age = 18)</code>.</p>`),
section('5. Передача по значению, ref, out и in',`<p>Для типов-значений вроде <code class="inline-code">int</code> обычный параметр получает копию значения. Поэтому увеличение локального параметра не меняет исходную переменную.</p>${codeBox('void Inc(int n) { n++; }\nint x = 5; Inc(x);\nConsole.WriteLine(x); // 5\n\nvoid IncRef(ref int n) { n++; }\nIncRef(ref x);\nConsole.WriteLine(x); // 6') }<ul><li><b>По значению:</b> аргумент копируется в параметр.</li><li><b>ref:</b> метод работает с переданной переменной по ссылке; аргумент должен быть инициализирован, <code>ref</code> указывается и при объявлении, и при вызове.</li><li><b>out:</b> позволяет вернуть значение через параметр; метод обязан присвоить ему значение до выхода.</li><li><b>in:</b> передача по ссылке только для чтения, например, чтобы не копировать крупную структуру.</li></ul><div class="info"><b>Простое правило:</b> изменить исходную переменную — <code>ref</code>; получить дополнительный результат через параметр — <code>out</code>; передать по ссылке только для чтения — <code>in</code>.</div>`)
],questions:[
Q('b2q1','Массивы','Какой индекс у первого элемента массива в C#?',['1','0','-1','Длина массива'],1,'Индексы начинаются с нуля.'),
Q('b2q2','Массивы','Что означает arr[^1]?',['Первый элемент','Последний элемент','Длина массива','Элемент с индексом -1'],1,'Оператор ^ задаёт индекс относительно конца; ^1 означает последний элемент.'),
Q('b2q3','Циклы','Какой цикл обычно удобнее, когда нужен индекс элемента?',['for','foreach всегда','try','switch'],0,'В for счётчик и индекс доступны явно.'),
Q('b2q4','Строки','Что вернёт "Hello".Length?',['4','5','6','Ошибка'],1,'В слове Hello пять символов.'),
Q('b2q5','Строки','Какой метод удаляет пробелы по краям строки?',['Split','Trim','ReplaceAll','Join'],1,'Trim возвращает строку без пробельных символов в начале и конце.'),
Q('b2q6','Методы','Что означает void в объявлении метода?',['Метод возвращает ноль','Метод не возвращает значение','Метод приватный','Метод асинхронный'],1,'void указывает на отсутствие возвращаемого значения.'),
Q('b2q7','Передача параметров','Что напечатает код: void Inc(int n){n++;} int x=5; Inc(x); Console.WriteLine(x);?',['5','6','0','Ошибка компиляции'],0,'Обычный параметр получает копию int; исходный x не меняется.'),
Q('b2q8','Передача параметров','Что верно про out?',['Значение нельзя менять','Метод обязан присвоить out-параметру значение','Работает только со строками','Равнозначен return void'],1,'out предназначен для передачи результата через параметр; параметр должен получить значение внутри метода.'),
Q('b2q9','Передача параметров','Какой модификатор позволяет методу изменить исходную переменную через параметр?',['const','ref','using','params'],1,'ref указывается как в объявлении, так и при вызове.')
]},
{id:'b3',number:'03',icon:'⌕',title:'LINQ — запросы к данным',short:'Фильтрация, сортировка, проекция и цепочки методов',source:'Лекция 3 · вопросы 9–11',intro:'LINQ помогает отбирать и преобразовывать данные коротко и выразительно, без ручного создания промежуточных списков.',sections:[
section('1. Что такое LINQ',`<p><b class="term">LINQ</b> — Language-Integrated Query, запросы к данным средствами языка C#. Подход одинаково помогает работать с массивами и коллекциями, а также с другими источниками, для которых есть соответствующий LINQ-провайдер.</p><p>В учебном примере LINQ to Objects используется с обычным массивом строк. Большинство запросов к <code class="inline-code">IEnumerable&lt;T&gt;</code> строится с помощью операторов запроса или методов расширения.</p>`),
section('2. Синтаксис запросов',`<p>Синтаксис похож на SQL и читается как «взять элементы из источника, отфильтровать, упорядочить и выбрать».</p>${codeBox('string[] people = { "Tom", "Bob", "Tim", "Sam" };\nvar result = from person in people\n             where person.StartsWith("T")\n             orderby person\n             select person;\n\nforeach (var name in result)\n    Console.WriteLine(name); // Tim, Tom') }<ul><li><code class="inline-code">from</code> задаёт источник и переменную элемента.</li><li><code class="inline-code">where</code> фильтрует по условию.</li><li><code class="inline-code">orderby</code> сортирует.</li><li><code class="inline-code">select</code> определяет, что попадёт в результат.</li></ul>`),
section('3. Методы расширения и лямбда-выражения',`<p>Ту же операцию часто записывают цепочкой методов. Лямбда <code class="inline-code">p =&gt; p.StartsWith("T")</code> означает небольшую функцию: получить <code>p</code> и вернуть результат проверки.</p>${codeBox('var result = people\n    .Where(p => p.StartsWith("T"))\n    .OrderBy(p => p)\n    .Select(p => p.ToUpper());') }<p><code class="inline-code">Where</code> выбирает подходящие элементы, <code class="inline-code">Select</code> преобразует их, <code class="inline-code">OrderBy</code> сортирует по возрастанию. Часто используемые методы: <code>GroupBy</code>, <code>Join</code>, <code>Count</code>, <code>Sum</code>, <code>Average</code>, <code>Any</code>, <code>All</code>, <code>FirstOrDefault</code>, <code>Distinct</code>, <code>Take</code> и <code>Skip</code>.</p>`),
section('4. Разновидности LINQ',`<ul><li><b>LINQ to Objects:</b> массивы и коллекции в памяти.</li><li><b>LINQ to Entities:</b> запросы к БД через Entity Framework.</li><li><b>LINQ to XML:</b> обработка XML.</li><li><b>LINQ to DataSet:</b> работа с DataSet.</li><li><b>PLINQ:</b> параллельное выполнение запросов там, где это подходит.</li></ul><p>Для большинства задач с массивами и коллекциями нужно пространство имён <code class="inline-code">System.Linq</code>.</p>`),
section('5. Отложенное выполнение',`<p>Многие LINQ-операции, возвращающие последовательность, не выполняют запрос сразу. Выражение с <code class="inline-code">Where</code> и <code class="inline-code">Select</code> обычно вычисляется при перечислении результата, например в <code class="inline-code">foreach</code>. Вызов <code class="inline-code">ToList()</code> материализует результат в список; агрегаты вроде <code class="inline-code">Count()</code> выполняются для получения числа.</p><div class="alert"><b>Не путай</b><code>Where</code> — фильтр, <code>Select</code> — преобразование каждого элемента. Это разные задачи.</div>`)
],questions:[
Q('b3q1','Основы LINQ','Что означает LINQ?',['Language-Integrated Query','Local Internet Network Queue','Language Interface for New Queries','List Index Number Query'],0,'LINQ — Language-Integrated Query.'),
Q('b3q2','Разновидности','Какой вариант LINQ работает с массивами и обычными коллекциями в памяти?',['LINQ to Objects','LINQ to XML','PLINQ only','LINQ to DataSet'],0,'LINQ to Objects — для объектов и коллекций.'),
Q('b3q3','Методы расширения','Что делает Where?',['Сортирует','Фильтрует элементы по условию','Преобразует каждый элемент','Записывает в файл'],1,'Where оставляет только те элементы, для которых условие истинно.'),
Q('b3q4','Методы расширения','Для чего нужен Select?',['Проекция: преобразовать каждый элемент в результат','Удалить весь список','Поймать исключение','Открыть окно'],0,'Select строит последовательность из результатов преобразования.'),
Q('b3q5','Синтаксис запроса','Какой оператор в запросе LINQ фильтрует элементы?',['select','orderby','where','from'],2,'where задаёт критерий отбора.'),
Q('b3q6','Сортировка','Чем OrderByDescending отличается от OrderBy?',['Ничем','Сортирует по убыванию вместо возрастания','Только фильтрует','Всегда сортирует строки по длине'],1,'Descending означает порядок по убыванию.'),
Q('b3q7','Выполнение','Когда часто выполняется LINQ-запрос, который возвращает IEnumerable?',['При перечислении результата','В момент запуска Visual Studio','Только после закрытия программы','Никогда'],0,'Многие запросы выполняются отложенно — при перечислении; ToList материализует результат.'),
Q('b3q8','Методы расширения','Что проверяет Any()?',['Все ли элементы подходят','Есть ли хотя бы один подходящий элемент','Сортирует элементы','Возвращает последний элемент'],1,'Any возвращает true, если есть хотя бы один элемент, удовлетворяющий условию, или если последовательность не пуста в перегрузке без условия.')
]},
{id:'b4',number:'04',icon:'⚡',title:'Делегаты и события',short:'Ссылки на методы, список вызовов и уведомления',source:'Лекция 4 · вопросы 12–15',intro:'Поймём, как хранить ссылку на метод, передавать поведение в другой код и сообщать подписчикам о событиях.',sections:[
section('1. Делегат — тип ссылки на метод',`<p><b class="term">Делегат</b> — тип, экземпляры которого могут ссылаться на методы с совместимой сигнатурой. Сигнатура определяет список параметров и возвращаемый тип, включая применимые модификаторы.</p>${codeBox('delegate int Operation(int x, int y);\n\nint Add(int x, int y) => x + y;\nint Multiply(int x, int y) => x * y;\n\nOperation op = Add;\nConsole.WriteLine(op(4, 5)); // 9\nop = Multiply;\nConsole.WriteLine(op(4, 5)); // 20') }<p>Методу не обязательно находиться в том же классе. Можно присвоить метод напрямую: <code class="inline-code">Operation op = Add;</code> или через конструктор делегата. Метод должен быть совместим по типам параметров и возвращаемому типу.</p>`),
section('2. Многоадресные делегаты',`<p>Делегат может хранить список вызовов. Оператор <code class="inline-code">+=</code> добавляет обработчик, <code class="inline-code">-=</code> удаляет.</p>${codeBox('delegate void Message();\nvoid First() => Console.WriteLine("Первый");\nvoid Second() => Console.WriteLine("Второй");\n\nMessage? msg = First;\nmsg += Second;\nmsg?.Invoke(); // сначала First, затем Second') }<p>Для делегата, который возвращает значение и содержит несколько методов, вызываются все методы, но результатом вызова становится возвращаемое значение последнего обработчика.</p>`),
section('3. Событие и обработчик',`<p><b class="term">Событие</b> — механизм уведомления подписчиков о том, что что-то произошло. Класс, в котором объявлено событие, обычно решает, когда его вызвать; внешние объекты могут подписываться и отписываться.</p>${codeBox('class Alarm\n{\n    public event EventHandler? Ring;\n\n    public void Trigger()\n    {\n        Ring?.Invoke(this, EventArgs.Empty);\n    }\n}\n\nvar alarm = new Alarm();\nalarm.Ring += (sender, e) => Console.WriteLine("Сработало!");\nalarm.Trigger();') }<p>В обработчиках часто встречаются аргументы <code class="inline-code">sender</code> (источник события) и <code class="inline-code">e</code> (данные о событии). Для дополнительных данных создают класс аргументов события, например класс с сообщением и суммой.</p>`),
section('4. Делегаты и события в интерфейсе',`<p>Кнопка WinForms вызывает обработчик события нажатия. В типичном обработчике есть параметры <code class="inline-code">object sender</code> и <code class="inline-code">EventArgs e</code>. Это тот же принцип событийной модели C#: объект сообщает о действии, подписанный обработчик реагирует.</p><p>В WPF часто вместо привязки к обработчикам Click используют команды через MVVM. Это не отменяет событий внутри платформы, но меняет способ связи интерфейса с логикой.</p>`)
],questions:[
Q('b4q1','Делегаты','Что такое делегат?',['Тип, экземпляры которого ссылаются на методы совместимой сигнатуры','Список строк','Файл конфигурации','Специальный цикл'],0,'Делегат задаёт допустимые параметры и возвращаемый тип для вызываемого метода.'),
Q('b4q2','Сигнатура','Что должно совпадать, чтобы метод подходил делегату?',['Только имя метода','Параметры и возвращаемый тип с учетом совместимости','Имя класса','Количество строк кода'],1,'Сравнивают сигнатуру и совместимость типов.'),
Q('b4q3','Присвоение метода','Какое присваивание может быть допустимо, если Add соответствует делегату Operation?',['Operation op = Add;','Operation op = "Add";','Operation = Add();','delegate Add = Operation;'],0,'Переменной делегата можно присвоить группу методов подходящей сигнатуры.'),
Q('b4q4','Многоадресность','Что делает msg += Handler?',['Удаляет делегат','Добавляет обработчик к списку вызовов','Останавливает приложение','Переводит метод в строку'],1,'+= добавляет ещё один метод в invocation list.'),
Q('b4q5','События','Зачем используют event?',['Чтобы хранить JSON','Чтобы уведомлять подписчиков о произошедшем событии','Чтобы сортировать массив','Чтобы компилировать код'],1,'Событие обеспечивает контролируемую подписку и отписку.'),
Q('b4q6','События','Что обычно означает sender в обработчике события?',['Объект, который инициировал событие','Текст кнопки','Тип исключения','Файл с исходным кодом'],0,'sender обычно передаёт ссылку на объект-источник события.'),
Q('b4q7','Аргументы событий','Зачем создают собственный класс аргументов события?',['Чтобы передать дополнительные данные о событии','Чтобы запретить подписки','Чтобы заменить CLR','Чтобы хранить только методы'],0,'Собственный класс аргументов может содержать нужные поля или свойства.'),
Q('b4q8','Делегаты','Что вернёт многоадресный делегат с возвращаемым значением?',['Сумму всех результатов автоматически','Результат последнего вызванного метода','Результат первого метода всегда','Всегда null'],1,'Все методы вызываются по порядку, но итоговый return — результат последнего вызова.')
]},
{id:'b5',number:'05',icon:'▤',title:'Файлы, потоки и коллекции',short:'File, FileInfo, FileStream, чтение, запись, List и Dictionary',source:'Лекция 5 · вопросы 16–24',intro:'Разберём, как приложение сохраняет данные в файлы и чем различаются основные коллекции.',sections:[
section('1. File и FileInfo',`<p><code class="inline-code">File</code> предоставляет статические методы работы с файлами без создания объекта. <code class="inline-code">FileInfo</code> — объект, описывающий конкретный файл, с методами и свойствами.</p><table class="mini-table"><tr><th>Действие</th><th>File</th><th>FileInfo</th></tr><tr><td>Проверка существования</td><td><code>File.Exists(path)</code></td><td><code>info.Exists</code></td></tr><tr><td>Удаление</td><td><code>File.Delete(path)</code></td><td><code>info.Delete()</code></td></tr><tr><td>Копирование</td><td><code>File.Copy(src,dst,true)</code></td><td><code>info.CopyTo(dst,true)</code></td></tr><tr><td>Перемещение</td><td><code>File.Move(src,dst)</code></td><td><code>info.MoveTo(dst)</code></td></tr><tr><td>Метаданные</td><td>—</td><td><code>Name</code>, <code>Length</code>, <code>Extension</code>, <code>FullName</code></td></tr></table>${codeBox('string path = "notes.txt";\nFile.WriteAllText(path, "Первая строка");\nFile.AppendAllText(path, "\\nВторая строка");\nstring content = File.ReadAllText(path);\nConsole.WriteLine(content);') }<p>Абсолютный путь содержит полный адрес. Относительный путь трактуется от рабочей папки приложения. Каталог перед записью должен существовать либо быть создан.</p>`),
section('2. FileStream и текстовые потоки',`<p><b class="term">FileStream</b> работает с файлом как с потоком байтов. Он подходит для низкоуровневого чтения и записи бинарных данных. Для удобной работы с текстом поверх потоков обычно используют <code class="inline-code">StreamReader</code> и <code class="inline-code">StreamWriter</code>.</p>${codeBox('using (var stream = new FileStream("data.bin", FileMode.Create))\n{\n    byte[] bytes = { 10, 20, 30 };\n    stream.Write(bytes, 0, bytes.Length);\n}\n\nusing (var writer = new StreamWriter("note.txt", append: false))\n{\n    writer.WriteLine("Первая строка");\n    writer.WriteLine("Вторая строка");\n}\n\nusing (var reader = new StreamReader("note.txt"))\n{\n    string? line;\n    while ((line = reader.ReadLine()) != null)\n        Console.WriteLine(line);\n}') }<ul><li><code>ReadAllText</code> — прочитать весь текст.</li><li><code>ReadAllLines</code> — получить массив строк.</li><li><code>WriteAllText</code> — записать весь текст, перезаписав файл.</li><li><code>AppendAllText</code> — дописать в конец.</li><li><code>ReadLine</code> — одна строка, <code>ReadToEnd</code> — остаток потока, <code>WriteLine</code> добавляет перевод строки.</li></ul><p><code class="inline-code">using</code> гарантирует освобождение ресурса после завершения блока, в том числе при исключении.</p>`),
section('3. Коллекции: что выбрать',`<table class="mini-table"><tr><th>Коллекция</th><th>Идея</th><th>Когда удобна</th></tr><tr><td><code>List&lt;T&gt;</code></td><td>Изменяемый список</td><td>Элементы по порядку и доступ по индексу</td></tr><tr><td><code>Dictionary&lt;K,V&gt;</code></td><td>Ключ → значение</td><td>Быстрый поиск по ключу</td></tr><tr><td><code>Queue&lt;T&gt;</code></td><td>FIFO</td><td>Первым обслуживается добавленный раньше</td></tr><tr><td><code>Stack&lt;T&gt;</code></td><td>LIFO</td><td>Последним добавили — первым достали</td></tr><tr><td><code>HashSet&lt;T&gt;</code></td><td>Множество уникальных элементов</td><td>Не хранить повторения</td></tr><tr><td><code>ObservableCollection&lt;T&gt;</code></td><td>Коллекция с уведомлениями об изменении</td><td>Обновлять связанные элементы UI, например в WPF</td></tr></table>${codeBox('var ages = new Dictionary<string, int>\n{\n    ["Аня"] = 19,\n    ["Илья"] = 20\n};\n\nif (ages.TryGetValue("Аня", out int age))\n    Console.WriteLine(age);\n\nvar names = new List<string> { "Аня", "Илья" };\nnames.Add("Миша");') }<p>Инициализация словаря может выглядеть как <code class="inline-code">new Dictionary&lt;string, int&gt; { ["key"] = 123 }</code>. Доступ <code class="inline-code">dict[key]</code> выбрасывает <code>KeyNotFoundException</code>, если ключ отсутствует; <code>TryGetValue</code> позволяет проверить его наличие безопаснее.</p>`),
section('4. Как не терять данные',`<p>После изменения данных приложение должно записать их в файл. При запуске оно читает файл и восстанавливает состояние. При работе с файлом возможны ошибки доступа, отсутствия каталога или некорректного содержимого, поэтому важно правильно освобождать потоки и предусматривать обработку ожидаемых исключений.</p><p>В курсовой используется сериализация списка задач в JSON через <code class="inline-code">System.Text.Json</code>. Важно уметь объяснить путь к файлу, что означает сериализация и в какой момент выполняется запись.</p>`)
],questions:[
Q('b5q1','Файлы','В чём главное отличие File от FileInfo?',['File — статические методы, FileInfo — объект конкретного файла','File работает только с JSON','FileInfo работает только с папками','Между ними нет различий'],0,'File использует статические методы; FileInfo представляет информацию о конкретном файле.'),
Q('b5q2','Файлы','Как дописать текст в конец существующего файла?',['File.ReadAllText','File.AppendAllText','File.Delete','Directory.GetFiles'],1,'AppendAllText дописывает строку в конец и создаёт файл, если это предусмотрено методом.'),
Q('b5q3','Потоки','Для чего нужен FileStream?',['Для работы с потоком байтов файла','Для построения WPF Binding','Для фильтрации LINQ','Для объявления событий'],0,'FileStream работает с файлом как с последовательностью байтов.'),
Q('b5q4','Чтение текста','Какой метод StreamReader читает одну строку?',['ReadLine','ReadAllLines','WriteLine','AppendAllText'],0,'ReadLine читает одну строку и обычно возвращает null при достижении конца файла.'),
Q('b5q5','Запись текста','Что делает StreamWriter.WriteLine()?',['Пишет значение и перевод строки','Удаляет файл','Читает весь файл','Сортирует коллекцию'],0,'WriteLine записывает переданное значение и символ окончания строки.'),
Q('b5q6','Коллекции','Какая коллекция использует принцип FIFO?',['Stack<T>','Queue<T>','Dictionary<K,V>','HashSet<T>'],1,'FIFO — First In, First Out, очередь.'),
Q('b5q7','Коллекции','Что хранит Dictionary<TKey,TValue>?',['Только упорядоченные числа','Пары ключ-значение','Только уникальные строки без ключей','Методы и делегаты'],1,'Словарь сопоставляет ключ с соответствующим значением.'),
Q('b5q8','Коллекции','Что особенного в ObservableCollection<T>?',['Она не допускает изменений','Уведомляет UI об изменениях коллекции','Автоматически шифрует данные','Работает только с файлами'],1,'Она уведомляет подписанную view о добавлении/удалении элементов, что особенно полезно в WPF.'),
Q('b5q9','Освобождение ресурсов','Зачем потоки часто используют с using?',['Чтобы ресурс был освобождён после блока','Чтобы данные сортировались','Чтобы не компилировать программу','Чтобы файл никогда не закрывался'],0,'using гарантирует вызов освобождения ресурса, в том числе при выходе из блока из-за исключения.')
]},
{id:'b6',number:'06',icon:'🛡️',title:'Общая память и исключения',short:'MemoryMappedFile, try/catch/finally и проверки ввода',source:'Лекция 6 · вопросы 25–30',intro:'Две части лекции: общий ресурс памяти между процессами и обработка ситуаций, когда обычный ход программы нарушается.',sections:[
section('1. Исключение — что это',`<p><b class="term">Исключение</b> — объект, описывающий ошибочную или неожиданную ситуацию во время выполнения. Пример — попытка делить целое число на ноль, прочитать недопустимый индекс или открыть файл, к которому нет доступа.</p><p>Исключение не следует путать с любой логической ошибкой. Например, пользователь ввёл пустое имя — это часто лучше проверить условием до сохранения, а не использовать исключение как обычный механизм ветвления.</p>`),
section('2. try, catch и finally',`<p><code class="inline-code">try</code> содержит код, где может возникнуть исключение. <code class="inline-code">catch</code> перехватывает подходящее исключение. <code class="inline-code">finally</code> выполняется после try и возможного catch — обычно для освобождения ресурсов или обязательного завершающего действия.</p>${codeBox('try\n{\n    int x = int.Parse("abc");\n    Console.WriteLine(x);\n}\ncatch (FormatException ex)\n{\n    Console.WriteLine("Ожидалось число: " + ex.Message);\n}\nfinally\n{\n    Console.WriteLine("Проверка завершена");\n}') }<p><code class="inline-code">try</code> обязателен. Допускается try/catch и try/finally, но нельзя убрать и catch, и finally одновременно. Ставь более конкретные типы catch раньше базового <code>Exception</code>, иначе общий обработчик перехватит подходящие случаи раньше.</p>`),
section('3. Выбирать между условием и исключением',`<p>Если ситуация ожидаема, полезно проверить её обычным условием. Например, <code class="inline-code">int.TryParse</code> проверяет формат ввода; не нужно каждый раз пробовать <code>int.Parse</code> и ловить исключение ради обычной ошибки пользователя.</p>${codeBox('if (int.TryParse(input, out int number))\n{\n    Console.WriteLine(number * number);\n}\nelse\n{\n    Console.WriteLine("Введите целое число");\n}') }<p>Фильтр исключения <code class="inline-code">when</code> позволяет дополнительно проверить условие перед обработкой:</p>${codeBox('catch (IOException ex) when (ex.HResult != 0)\n{\n    Console.WriteLine("Ошибка ввода-вывода");\n}') }<p>В реальном проекте выражение фильтра выбирают по осмысленному признаку, который связан с типом сбоя.</p>`),
section('4. Разделяемые ресурсы и MemoryMappedFiles',`<p>Лекция 6 рассматривает взаимодействие приложений через участок общей памяти. Пространство имён <code class="inline-code">System.IO.MemoryMappedFiles</code> содержит, в частности, класс <code class="inline-code">MemoryMappedFile</code> для создания или открытия области памяти, отображённой в память процесса, и <code class="inline-code">MemoryMappedViewAccessor</code> для чтения и записи данных в эту область.</p><p>Идея учебного примера: одно приложение записывает длину и содержимое сообщения, другое открывает ту же область и считывает данные. Оба приложения должны согласовать имя области, размер и формат представления данных.</p><div class="alert"><b>На защите</b>Не смешивай MemoryMappedFile и обычный файл JSON: это разные способы обмена/хранения. Общая память нужна, когда процессам требуется работать с общим участком данных.</div>`),
section('5. Пространства имён',`<p><b>Пространство имён</b> (<code class="inline-code">namespace</code>) группирует связанные типы и помогает избегать конфликтов имён. Например, <code>System.IO</code> содержит типы работы с файлами, <code>System.Linq</code> — LINQ-операции, <code>System.ComponentModel.DataAnnotations</code> — атрибуты валидации, а <code>System.IO.MemoryMappedFiles</code> — типы отображаемых файлов.</p><p>Директива <code class="inline-code">using System.IO;</code> позволяет обращаться к типам этого пространства имён без полного префикса, но сама по себе не освобождает файловый ресурс — это роль конструкций вроде <code>using (var reader = ...)</code>.</p>`)
],questions:[
Q('b6q1','Исключения','Какое назначение у try?',['Содержит код, в котором может возникнуть исключение','Всегда выводит сообщение','Создаёт пространство имён','Пишет JSON'],0,'try обозначает участок кода, ошибки которого могут быть обработаны.'),
Q('b6q2','Исключения','Когда выполняется finally?',['Только если поймали исключение','После try и возможного catch, независимо от обычного наличия ошибки','Только при отсутствии исключения','Только при закрытии окна'],1,'finally выполняется после try/catch в обычных сценариях потока управления и используется для завершающих действий.'),
Q('b6q3','Исключения','Что обычно стоит делать с ожидаемым неверным числовым вводом?',['Использовать int.TryParse','Завершить процесс','Поймать Exception вокруг всей программы','Превратить строку в JSON'],0,'TryParse помогает проверить формат без использования исключения как обычного ветвления.'),
Q('b6q4','Исключения','Как следует располагать catch для конкретного исключения и Exception?',['Exception всегда первым','Конкретный тип раньше базового Exception','Порядок никогда не важен','catch не может иметь тип'],1,'Базовый Exception стоит после более конкретных типов.'),
Q('b6q5','MemoryMappedFiles','Для чего нужен MemoryMappedFile в контексте лекции?',['Для общей области памяти, доступной взаимодействующим процессам','Для запуска циклов','Для отображения WPF-кнопок','Для создания LINQ-запроса'],0,'MemoryMappedFile позволяет приложениям взаимодействовать через отображаемую область памяти.'),
Q('b6q6','MemoryMappedFiles','Для чего используется MemoryMappedViewAccessor?',['Для чтения/записи данных в область памяти','Для сортировки коллекций','Для вывода сообщения в консоль только','Для запуска тестов'],0,'ViewAccessor предоставляет доступ к чтению и записи отображаемой области.'),
Q('b6q7','Исключения','Почему опасно ставить catch(Exception) перед catch(IOException)?',['Потому что базовый обработчик может перехватить исключение раньше конкретного','Это всегда ускоряет программу','Exception — не тип','IOException не наследуется от Exception'],0,'Более общий обработчик должен идти позже, иначе более специфичный может стать недостижимым.'),
Q('b6q8','Пространства имён','Зачем нужны namespace?',['Группировать типы и снижать риск конфликтов имен','Создавать память на диске','Заменять классы','Включать finally'],0,'Пространства имён организуют типы по группам и помогают избегать конфликтов имен.')
]},
{id:'b7',number:'07',icon:'▣',title:'Платформа .NET и интерфейсы WinForms',short:'Окна, элементы управления, события и взаимодействие с ОС',source:'Лекция 7 · вопросы 31–35',intro:'В лекции акцент на Windows Forms: из чего состоит графическое приложение и как окно реагирует на действия пользователя.',sections:[
section('1. Технологии и библиотеки .NET',`<p>Платформа .NET включает среды выполнения, компиляторы, библиотеки базовых классов и инструменты разработки. Библиотеки дают готовые типы, чтобы не реализовывать вручную каждую операцию.</p><ul><li><code class="inline-code">System</code> — базовые типы.</li><li><code class="inline-code">System.IO</code> — файлы и потоки.</li><li><code class="inline-code">System.Linq</code> — LINQ.</li><li><code class="inline-code">System.Collections.Generic</code> — коллекции.</li><li><code class="inline-code">System.Windows.Forms</code> — WinForms-интерфейс.</li><li><code class="inline-code">System.ComponentModel.DataAnnotations</code> — атрибуты валидации.</li></ul><p>В лекции упоминаются WinForms, WPF и UWP как технологии создания графических интерфейсов. Тема лекции подробно показывает WinForms, а курсовая использует WPF.</p>`),
section('2. Структура WinForms-проекта',`<p>В учебном проекте могут встречаться:</p><ul><li><b>.csproj</b> — настройки проекта: тип приложения, целевая версия .NET и параметры сборки.</li><li><b>Program.cs</b> — точка входа, инициализация и запуск главной формы.</li><li><b>Form1.cs</b> — код формы и обработчики.</li><li><b>Form1.Designer.cs</b> — создаваемые дизайнером элементы управления и их настройка.</li></ul>${codeBox('[STAThread]\nstatic void Main()\n{\n    ApplicationConfiguration.Initialize();\n    Application.Run(new Form1());\n}') }<p><code class="inline-code">Application.Run(new Form1())</code> запускает главную форму приложения. Когда главная форма закрывается, приложение обычно завершает работу.</p>`),
section('3. Форма и элементы управления',`<p><b>Форма</b> — окно, на котором размещают элементы управления. Кнопки, текстовые поля, списки, метки и другие элементы имеют свойства, методы и события.</p><ul><li><b>Свойства:</b> например, <code>Text</code>, <code>BackColor</code>, <code>Size</code>, <code>Name</code>.</li><li><b>Методы:</b> действия, которые объект может выполнять.</li><li><b>События:</b> сигналы о действиях, например Click или Load.</li></ul><p>Действие пользователя обрабатывается методом-обработчиком. При двойном щелчке по кнопке Visual Studio может сгенерировать обработчик Click. Его сигнатура типично включает <code class="inline-code">object sender</code> и <code class="inline-code">EventArgs e</code>.</p>${codeBox('private void button1_Click(object sender, EventArgs e)\n{\n    MessageBox.Show("Кнопка нажата");\n}')}`),
section('4. Взаимодействие форм и ОС',`<p>Чтобы открыть вторую форму из первой, создают экземпляр формы и вызывают <code class="inline-code">Show()</code> или подходящий метод показа окна.</p>${codeBox('private void button1_Click(object sender, EventArgs e)\n{\n    var second = new Form2();\n    second.Show();\n}') }<p>Если вторая форма должна воздействовать на первую, ей можно передать ссылку на объект первой формы, например через конструктор. Ключевое слово <code class="inline-code">this</code> указывает на текущий экземпляр объекта.</p><p>Приложение взаимодействует с операционной системой через API и механизмы платформы: получение событий мыши и клавиатуры, создание окна, отрисовку, доступ к файлам. В настольных программах интерфейсные события поступают от системы и приводят к вызову обработчиков.</p>`),
section('5. WinForms и WPF — не путай на защите',`<table class="mini-table"><tr><th>Технология</th><th>Что важно сказать</th></tr><tr><td>WinForms</td><td>Формы и контролы; часты обработчики событий типа Click; дизайнер генерирует код интерфейса.</td></tr><tr><td>WPF</td><td>XAML-разметка, мощные привязки данных, стили и шаблоны; часто применяется с MVVM.</td></tr></table><p>Вопросы зачёта про интерфейс и работу с событиями опираются на лекции 7–8 и в основном демонстрируют WinForms. Но объясняя собственную курсовую, нужно говорить о WPF, потому что она написана именно на WPF.</p>`)
],questions:[
Q('b7q1','.NET','Что входит в платформу .NET?',['Только язык C#','Среда выполнения, библиотеки и инструменты','Только база данных','Только IDE'],1,'.NET — платформа с runtime, библиотеками, компиляторами и инструментами.'),
Q('b7q2','WinForms','Для чего служит Program.cs в типичном WinForms-проекте?',['Для входа в приложение и запуска главной формы','Для хранения JSON-задач','Для объявления всех моделей','Для тестирования LINQ'],0,'В Program.cs находится точка входа, инициализация и Application.Run.'),
Q('b7q3','WinForms','Что выполняет Application.Run(new Form1())?',['Запускает главную форму','Закрывает все файлы','Создаёт делегат','Запускает SQL-запрос'],0,'Application.Run запускает цикл обработки сообщений и показывает форму.'),
Q('b7q4','Интерфейс','Что такое обработчик события?',['Метод, выполняющийся в ответ на событие','Тип массива','Значение свойства Text','Файл проекта'],0,'Обработчик — метод, подписанный на событие.'),
Q('b7q5','События','Какие параметры часто встречаются в обработчике WinForms?',['sender и EventArgs e','x и y только','FileInfo и Stream','ref и out обязательно'],0,'Типичная сигнатура — object sender, EventArgs e.'),
Q('b7q6','Взаимодействие форм','Как обычно показать созданную Form2?',['new Form2().Show()','File.WriteAllText','Console.ReadLine','new List<Form2>()'],0,'Нужно создать экземпляр формы и вызвать метод показа.'),
Q('b7q7','Технологии UI','Какая технология в курсовой использует XAML и MVVM?',['WPF','Только консоль','FileStream','PLINQ'],0,'Курсовая использует WPF; интерфейс описан в XAML и связан с ViewModel.'),
Q('b7q8','Библиотеки','Какое пространство имён относится к LINQ?',['System.Linq','System.Windows.Forms','System.IO.MemoryMappedFiles','System.Drawing.Imaging only'],0,'System.Linq содержит LINQ-операции для последовательностей.')
]},
{id:'b8',number:'08',icon:'🧪',title:'Отладка, тестирование и развитие ПО',short:'Ошибки, валидация, тесты, качество и жизненный цикл',source:'Лекция 8 · вопросы 36–37',intro:'Нужно уметь отличать запуск без ошибок от проверки качества. Здесь собраны приёмы отладки, события и виды тестирования.',sections:[
section('1. Отладка: найти причину, а не симптом',`<p><b>Отладка</b> — процесс поиска и устранения дефектов. В Visual Studio полезны точки останова, пошаговое выполнение, просмотр значений переменных и стека вызовов.</p><ul><li>Сначала воспроизведи ошибку.</li><li>Проверь конкретные входные данные и состояние переменных.</li><li>Найди место, где фактическое поведение расходится с ожидаемым.</li><li>Исправь причину и повтори проверку.</li></ul><p>Для примера, если после выбора сортировки порядок снова меняется, проверь не только сам метод сортировки, но и следующий метод обновления списка, который может пересортировать коллекцию ещё раз.</p>`),
section('2. Проверка входных данных и DataAnnotations',`<p>Валидация — проверка того, что входные данные удовлетворяют правилам предметной области. Можно проверять условия вручную, а можно применять атрибуты из <code class="inline-code">System.ComponentModel.DataAnnotations</code>.</p>${codeBox('using System.ComponentModel.DataAnnotations;\n\npublic class User\n{\n    [Required]\n    [StringLength(40, MinimumLength = 2)]\n    public string Name { get; set; } = "";\n\n    [Range(1, 100)]\n    public int Age { get; set; }\n}') }<ul><li><code class="inline-code">[Required]</code> — значение обязательно.</li><li><code class="inline-code">[StringLength]</code> — ограничения длины строки.</li><li><code class="inline-code">[Range]</code> — допустимый диапазон числового значения.</li><li><code class="inline-code">IValidatableObject</code> подходит для правил, зависящих от нескольких свойств.</li></ul><p>Атрибуты описывают правила, но приложение должно реально запустить механизм валидации и показать пользователю ошибки.</p>`),
section('3. Виды тестирования',`<table class="mini-table"><tr><th>Вид</th><th>Что проверяет</th><th>Пример для Task Manager</th></tr><tr><td>Ручное</td><td>Человек выполняет сценарий</td><td>Добавить задачу и проверить её в списке</td></tr><tr><td>Модульное (unit)</td><td>Отдельный метод/класс</td><td>Проверить, что пустой заголовок отклоняется</td></tr><tr><td>Интеграционное</td><td>Совместную работу частей</td><td>TaskService вместе с JSON-репозиторием</td></tr><tr><td>Регрессионное</td><td>Что старые сценарии не сломались после изменений</td><td>После изменения фильтра поиск всё ещё работает</td></tr><tr><td>Нагрузочное</td><td>Поведение при большом объёме/нагрузке</td><td>Обработка большого списка задач</td></tr></table><p><code class="inline-code">Assert</code> — проверка ожидаемого условия в тесте. В тестовых фреймворках есть проверки ожидаемых исключений; например, концептуально тест проверяет, что вызов с неверными данными выбрасывает нужный тип исключения.</p>`),
section('4. План тестирования и доказательства',`<p>Хороший тест содержит входные данные, действие, ожидаемый и фактический результат. Нельзя писать «всё работает», если конкретный сценарий не был выполнен. Для отчёта полезны таблица тестов, скриншоты состояния программы, примеры исходных данных и результаты автоматического запуска тестов.</p><p>Если в отчёте описаны только идеи модульных тестов, говори «сформулированы сценарии для автоматизации», а не «написаны и пройдены unit-тесты». Различай план тестирования, ручную проверку и реально выполненные автоматические тесты.</p>`),
section('5. Перспективы развития ПО',`<p>Программное обеспечение развивается через исправления, поддержку новых требований, улучшение удобства, производительности, безопасности и совместимости. Расширять программу стоит исходя из реальной потребности и архитектуры, а не просто добавляя функции.</p><ul><li><b>Сопровождение:</b> исправление дефектов и адаптация к изменениям среды.</li><li><b>Развитие:</b> новые возможности и сценарии.</li><li><b>Повышение качества:</b> тесты, валидация, безопасность и понятный интерфейс.</li><li><b>Расширяемость:</b> границы между модулями уменьшают объём изменений при добавлении функций.</li></ul><p>Для курсовой как реалистичные улучшения можно назвать уведомления, дополнительные фильтры, экспорт и отдельный тестовый проект — при условии, что эти функции представлены именно как будущие доработки.</p>`)
],questions:[
Q('b8q1','Отладка','Что такое отладка?',['Поиск и устранение причин дефектов','Добавление случайных функций','Только запуск программы','Переписывание интерфейса без проверки'],0,'Отладка помогает найти место и причину неправильного поведения.'),
Q('b8q2','Валидация','Для чего нужен атрибут Required?',['Требует обязательного значения','Сортирует по дате','Создаёт окно','Открывает файл'],0,'Required обозначает обязательное значение при использовании механизма валидации.'),
Q('b8q3','Тестирование','Что проверяет модульный тест?',['Небольшую изолированную часть — метод или класс','Только внешний дизайн','Всю систему пользователей в интернете','Скорость сети'],0,'Unit-тесты проверяют небольшие части системы в изоляции.'),

const courseSections=[
section('1. Что должно делать приложение',`<p>Тема курсовой: <b>«Приложение для управления задачами с графическим интерфейсом и системой приоритетов»</b>. В задании указаны C#, .NET, WPF и Visual Studio. Основные действия: добавление, редактирование, удаление, поиск, сортировка, отметка выполнения и хранение в JSON-файле.</p><p>Каждая задача в модели имеет идентификатор, название, описание, срок, приоритет, статус выполнения и дату создания. Приоритет представлен перечислением <code class="inline-code">PriorityLevel</code>: Low, Normal, High, Critical.</p>`),
section('2. Архитектура на пальцах',`<p><b>MVVM</b> расшифровывается Model–View–ViewModel.</p><ul><li><b>Model:</b> предметные данные — <code>TaskItem</code> и <code>PriorityLevel</code>.</li><li><b>View:</b> XAML-интерфейс — <code>MainWindow.xaml</code>. Описывает, как выглядят элементы.</li><li><b>ViewModel:</b> <code>MainViewModel</code> — свойства, команды и состояние экрана.</li><li><b>Service:</b> <code>TaskService</code> — операции над списком и проверка данных.</li><li><b>Repository:</b> <code>TaskRepository</code> — чтение и запись JSON-файла.</li></ul><div class="info"><b>Как сказать преподавателю:</b> «Я разделил представление, логику экрана, правила работы с задачами и хранение. Это упрощает сопровождение: изменение способа хранения можно сосредоточить в репозитории, а интерфейс не обязан напрямую работать с файлом».</div>`),
section('3. Ключевые классы проекта',`<p><b>TaskItem</b> — модель одной задачи. <code>Guid Id</code> создаёт уникальный идентификатор; <code>Title</code> — название; <code>Description</code> — описание; <code>DueDate</code> — срок; <code>Priority</code> — перечислимый приоритет; <code>IsCompleted</code> — признак выполнения; <code>CreatedAt</code> — время создания.</p><p><b>TaskRepository</b> формирует путь хранения в папке ApplicationData пользователя: <code class="inline-code">%AppData%\TaskManagerApp\tasks.json</code>. Метод <code>Load()</code> читает JSON и десериализует его в список объектов; <code>Save()</code> сериализует список и записывает файл.</p><p><b>TaskService</b> содержит загрузку и сортировку, операции с коллекцией, поиск, фильтр по статусу и валидацию. В данном исходном коде часть обновления коллекции фактически находится в ViewModel — важно не переутверждать, что каждый CRUD-метод сервиса сам выполняет всю операцию.</p>`),
section('4. ViewModel, привязки и команды',`<p><code class="inline-code">MainViewModel</code> реализует <code class="inline-code">INotifyPropertyChanged</code>. Когда свойство вроде <code>Title</code> меняется, вызывается <code>PropertyChanged</code>, и WPF может обновить привязанные элементы.</p><p><code class="inline-code">ObservableCollection&lt;TaskItem&gt;</code> сообщает интерфейсу об изменениях состава коллекции. В проекте есть <code>VisibleTasks</code> — набор задач, который отображается с учётом поиска и фильтра.</p><p><code class="inline-code">ICommand</code> описывает команду интерфейса. Класс <code class="inline-code">RelayCommand</code> хранит действие и необязательное условие доступности. Например, кнопка XAML указывает <code class="inline-code">Command="{Binding AddOrUpdateCommand}"</code>, а команда вызывает метод <code class="inline-code">SaveTask()</code>.</p>${codeBox('public class MainViewModel : INotifyPropertyChanged\n{\n    public ICommand AddOrUpdateCommand { get; }\n\n    public MainViewModel()\n    {\n        AddOrUpdateCommand = new RelayCommand(_ => SaveTask());\n    }\n\n    // SaveTask собирает объект, проверяет данные,\n    // сохраняет коллекцию и обновляет отображение.\n}')}`),
section('5. Путь сохранения задачи',`<ol><li>Пользователь вводит название, описание, срок и приоритет в элементы формы.</li><li>Привязки XAML записывают значения в свойства ViewModel.</li><li>Кнопка вызывает <code>AddOrUpdateCommand</code>.</li><li>Метод <code>SaveTask()</code> собирает временный объект <code>TaskItem</code>.</li><li>Вызов <code>_service.Validate(temp)</code> проверяет входные данные.</li><li>Новая задача добавляется в <code>_tasks</code>; при редактировании элемент заменяется по индексу.</li><li><code>_service.SaveTasks(_tasks)</code> записывает JSON через репозиторий.</li><li><code>RefreshView()</code> пересоздаёт видимый список с учётом фильтров и сортировки, затем форма очищается.</li></ol><p>Сериализация — преобразование объектов в формат хранения JSON. Десериализация — обратное создание объектов из JSON.</p>`),
section('6. Поиск, фильтр, сортировка',`<p>Поиск в <code>TaskService.Search</code> проверяет вхождение запроса в название и описание без учёта регистра (<code>StringComparison.OrdinalIgnoreCase</code>). Пустой запрос возвращает все задачи.</p><p><code>FilterByStatus</code> принимает nullable-значение bool: <code>null</code> — все задачи, <code>true</code> — завершённые, <code>false</code> — активные. Фильтр должен только менять отображение, а не удалять записи.</p><p>Сортировка по приоритету в коде ставит более высокий приоритет выше, затем сортирует по сроку и названию. Но метод <code>SortByDate()</code> вызывает <code>RefreshView()</code>, которая снова сортирует по приоритету в первую очередь. Поэтому реальная итоговая сортировка по дате может не соответствовать ожидаемой. Это известная проблема представленного исходника.</p>`),
section('7. Валидация и фактические ограничения кода',`<p>В текущем <code>TaskService.Validate</code> есть проверка непустого названия и проверка, что дата не раньше чем на пять лет от текущей даты. При этом в методе не видно полной проверки всех ограничений, перечисленных в текстовом описании работы.</p><div class="alert"><b>Важно по реальному исходнику</b><ul><li>В представленном XAML есть фильтры «Все задачи», «Активные», «Выполненные», но не видно элемента управления или команды, которые изменяют <code>IsCompleted</code>. Это означает, что сценарий «отметить задачу выполненной» в приложенном коде не завершён, хотя в описании заявлен.</li><li>Метод <code>UpdateTask()</code> сервиса сохраняет коллекцию, но сам не заменяет задачу в коллекции; фактическая замена выполняется в <code>MainViewModel.SaveTask()</code>.</li><li>Сортировка по дате может быть переопределена общей сортировкой внутри <code>RefreshView()</code>.</li><li>В <code>SaveTask()</code> вызов Validate может бросить исключение; в показанном методе нет явного try/catch для пользовательского сообщения. Не говори, что обработка всех ошибок уже реализована, если это не исправлено в актуальном проекте.</li></ul></div><p>Это не мешает объяснить архитектурную идею проекта. Но если преподаватель спросит «покажи, где реализована отметка выполнения», лучше честно показать модель/фильтр и указать, что интерфейсное действие требует доработки, чем придумывать несуществующую команду.</p>`),
section('8. Что проверялось в курсовой',`<p>В пояснительной записке описаны ручные сценарии: добавление, редактирование, удаление, поиск, сортировка и сохранение после перезапуска. В таблице указано, что фактический результат совпадал с ожидаемым.</p><p>Отдельно приведены <b>примеры модульных сценариев, предлагаемых к автоматизации</b>: пустое название, сохранение и загрузка, фильтрация по статусу. По тексту записки это не подтверждает, что отдельный тестовый проект был написан и запускался. На защите различай реально проведённую ручную проверку и планируемые unit-тесты.</p><p>Возможные направления развития, заявленные в записке: напоминания, календарная интеграция, дополнительные фильтры, экспорт в PDF и синхронизация. Это перспективы, а не функции текущего прототипа.</p>`)
];

function sprintView(){const completed=state.sprintDone.length;return `<div class="lesson-head"><div class="crumb">ЭКСПРЕСС-ПОВТОРЕНИЕ ПЕРЕД ПЕРЕСДАЧЕЙ</div><h1 class="lesson-title">⏱ Спринт на 40 минут</h1><p class="lesson-subtitle">Восемь лекций по 4 минуты и 8 минут на курсовую. Прочитай краткую опору, открой тему при необходимости и пройди мини-тест. Спринт не заменяет подробную подготовку — он помогает быстро проверить, что помнишь.</p></div><div class="card"><div class="crumb">ОБЩИЙ ТАЙМЕР</div><div class="sprint-clock" id="sprintClock">${formatClock(sprintSeconds)}</div><div class="sprint-status" id="sprintStatus">${sprintRunning?'Таймер идёт — двигайся по плану':sprintSeconds===2400?'Готов начать 40-минутный повтор':'Таймер на паузе'}</div><div class="sprint-track"><i id="sprintProgress" style="width:${(1-sprintSeconds/2400)*100}%"></i></div><div class="lesson-actions"><button class="btn btn-primary" data-action="sprint-toggle">${sprintRunning?'Ⅱ Пауза':'▶ Начать таймер'}</button><button class="btn btn-light" data-action="sprint-reset">↺ Сбросить 40 минут</button><span class="chip">${completed} / 9 этапов отмечено</span></div></div><div class="section-head"><div><h2>Маршрут повторения</h2><p>Отмечай этап после того, как проговоришь тему вслух.</p></div></div>${sprintParts.map((p,i)=>{const done=state.sprintDone.includes(p.id);return `<section class="sprint-part ${done?'done':''}"><div><span class="sprint-minute">Этап ${i+1} · ${p.minutes} минут</span><h3>${done?'✓ ':''}${escapeHtml(p.title)}</h3><p>${escapeHtml(p.summary)}</p></div><div class="sprint-actions"><button class="btn btn-light btn-small" data-action="sprint-open" data-id="${p.id}">Открыть тему</button><button class="btn btn-blue btn-small" data-action="sprint-mini-quiz" data-id="${p.id}">Мини-тест ${p.id==='coursework'?'· 6 вопросов':'· 3 вопроса'}</button><button class="btn ${done?'btn-light':'btn-primary'} btn-small" data-action="sprint-mark" data-id="${p.id}">${done?'Снять отметку':'Отметить повторенной'}</button></div></section>`}).join('')}<div class="info"><b>Правило спринта:</b> на каждый вопрос сначала ответь своими словами, потом сверяйся с объяснением. Если не можешь объяснить код без подсказки — не отмечай тему и возвращайся к полному конспекту.</div>`}
function updateSprintClock(){const clock=$('#sprintClock');if(clock)clock.textContent=formatClock(sprintSeconds);const fill=$('#sprintProgress');if(fill)fill.style.width=((1-sprintSeconds/2400)*100)+'%';const status=$('#sprintStatus');if(status)status.textContent=sprintSeconds<=0?'Время вышло — закончи оставшиеся темы без спешки.':sprintRunning?'Таймер идёт — двигайся по плану':sprintSeconds===2400?'Готов начать 40-минутный повтор':'Таймер на паузе';const btn=$('[data-action="sprint-toggle"]');if(btn)btn.textContent=sprintRunning?'Ⅱ Пауза':sprintSeconds<=0?'✓ Спринт завершён':sprintSeconds===2400?'▶ Начать 40 минут':'▶ Продолжить таймер'}
function toggleSprintTimer(){if(sprintRunning){clearInterval(sprintInterval);sprintInterval=null;sprintRunning=false;updateSprintClock();return}if(sprintSeconds<=0){updateSprintClock();return}sprintRunning=true;sprintInterval=setInterval(()=>{if(sprintSeconds>0)sprintSeconds--;if(sprintSeconds<=0){clearInterval(sprintInterval);sprintInterval=null;sprintRunning=false}sprintSeconds=Math.max(0,sprintSeconds);updateSprintClock()},1000);updateSprintClock()}
function resetSprintTimer(){clearInterval(sprintInterval);sprintInterval=null;sprintRunning=false;sprintSeconds=2400;if(activePage==='sprint')renderPage()}
function startSprintMiniQuiz(id){const part=sprintParts.find(p=>p.id===id);if(!part)return;if(id==='coursework'){startQuiz({id:'sprint-coursework',title:'Спринт · Курсовая Task Manager',questions:shuffle(courseQuestions.slice()).slice(0,6),sprintPart:id})}else{const b=blockById(id);if(b)startQuiz({id:`sprint-${id}`,title:`Спринт · ${part.title}`,questions:shuffle(b.questions.slice()).slice(0,3),sprintPart:id})}}
function toggleOralTimer(id,button){let t=oralTimers.get(id);if(!t){t={remaining:90,interval:null,running:false};oralTimers.set(id,t)}if(t.running){clearInterval(t.interval);t.interval=null;t.running=false;button.textContent=`▶ Продолжить ${formatClock(t.remaining)}`;return}if(t.remaining<=0)t.remaining=90;t.running=true;button.textContent=`Ⅱ Пауза ${formatClock(t.remaining)}`;const clock=$(`#oral-clock-${CSS.escape(id)}`);if(clock)clock.textContent=formatClock(t.remaining);t.interval=setInterval(()=>{t.remaining=Math.max(0,t.remaining-1);const c=$(`#oral-clock-${CSS.escape(id)}`);if(c)c.textContent=t.remaining?formatClock(t.remaining):'Время вышло';const b=$(`[data-action="oral-timer"][data-id="${id}"]`);if(t.remaining<=0){clearInterval(t.interval);t.interval=null;t.running=false;if(b)b.textContent='↻ Повторить 90 сек';return}if(b)b.textContent=`Ⅱ Пауза ${formatClock(t.remaining)}`},1000)}
function stopOralTimers(){for(const t of oralTimers.values())if(t.interval)clearInterval(t.interval);oralTimers.clear()}

<div class="grid">${blocks.map(b=>`<button class="card block-card" data-nav="${b.id}" style="text-align:left;color:inherit"><div class="block-top"><div class="block-icon">${b.icon}</div><span class="block-num">БЛОК ${b.number} ${state.completed.includes(b.id)?'✓':''}</span></div><h3>${escapeHtml(b.title)}</h3><p>${escapeHtml(b.short)}</p><div class="block-bottom"><div class="mini-track"><i style="width:${blockProgress(b.id)}%"></i></div><span class="block-percent">${blockProgress(b.id)}%</span></div></button>`).join('')}

<div class="section-head"><div><h2>Что обязательно успеть</h2><p>Быстрый маршрут, если до пересдачи осталось мало времени.</p></div></div>
<div class="grid"><div class="card"><h3>1. Пройти список из 37 вопросов</h3><p class="muted small">Проверь, что умеешь устно объяснить каждый пункт из официального списка.</p><div style="margin-top:14px"><button class="btn btn-light btn-small" data-nav="syllabus">Открыть список →</button></div></div><div class="card"><h3>2. Повторить ошибочные ответы</h3><p class="muted small">Все неправильные ответы собираются в одном месте вместе с объяснениями.</p><div style="margin-top:14px"><button class="btn btn-light btn-small" data-nav="mistakes">К ошибкам →</button></div></div><div class="card"><h3>3. Репетиция ответа по курсовой</h3><p class="muted small">Проверь архитектуру и настоящие детали исходника перед вопросами преподавателя.</p><div style="margin-top:14px"><button class="btn btn-light btn-small" data-nav="coursework">Готовиться к защите →</button></div></div></div>

function courseView(){state.lastBlock='coursework';saveState();return `<div class="lesson-head"><div class="crumb">ПРОЕКТНАЯ РАБОТА · WPF / MVVM / JSON</div><h1 class="lesson-title">📝 Разбор твоей курсовой</h1><p class="lesson-subtitle">Task Manager — приложение для управления задачами с графическим интерфейсом и системой приоритетов. Здесь объясняется и архитектура, и то, что действительно видно в приложенном исходном коде.</p><div class="chips"><span class="chip">C# + .NET</span><span class="chip">WPF + XAML</span><span class="chip">MVVM</span><span class="chip">System.Text.Json</span><span class="chip">${courseQuestions.length} вопросов по курсовой</span></div></div><div class="alert"><b>Главное для защиты</b>Не просто выучи названия классов. Научись проследить одну задачу от ввода в интерфейсе до JSON-файла. Ниже также отмечены реальные несоответствия между описанием работы и присланным кодом, которые лучше знать заранее.</div><div class="layout-two"><div>${renderLessons(courseSections)}<section class="lesson-section"><h3>Репетиция защиты: вопросы преподавателя</h3><p class="muted small">Сначала ответь вслух самостоятельно, затем раскрой короткую опору для ответа.</p>${oralQuestions.map((o,i)=>`<div class="oral"><button data-action="oral-toggle" data-id="oral-${i}"><span>${i+1}. ${escapeHtml(o[0])}</span><span>＋</span></button><div class="oral-tools"><button class="oral-timer" data-action="oral-timer" data-id="oral-${i}">⏱ Начать 90 сек</button><span class="oral-clock" id="oral-clock-oral-${i}">01:30</span></div><div class="answer" id="oral-${i}">${escapeHtml(o[1])}</div></div>`).join('')}</section><div class="card" style="margin-top:15px"><h3>Тест по курсовой</h3><p class="muted small">Проверь архитектуру, код, JSON, MVVM и вопросы, где важно отличать описание от фактической реализации.</p><button class="btn btn-primary" data-action="start-course-quiz">Начать тест · ${courseQuestions.length} вопросов →</button></div></div>${tocView(courseSections)}</div>`}
function cheatsView(){return `<div class="lesson-head"><div class="crumb">БЫСТРОЕ ПОВТОРЕНИЕ</div><h1 class="lesson-title">📚 Шпаргалки</h1><p class="lesson-subtitle">Короткие определения и опорные фразы. Нажми на карточку, чтобы раскрыть пояснение. Используй поиск, чтобы быстро найти термин.</p></div><div class="section-head"><div><h2>Карточки терминов</h2><p>Всего ${flashcards.length} определений по лекциям и курсовой.</p></div><input class="search" id="flashSearch" placeholder="Например: ref, LINQ, MVVM..." aria-label="Поиск по терминам"></div><div class="flash-grid" id="flashGrid">${renderFlashcards(flashcards)}</div><div class="section-head"><div><h2>Опорные формулы</h2><p>Самое частое, что нужно помнить в устном ответе.</p></div></div><div class="grid"><div class="card"><h3>Путь исполнения C#</h3><p class="small">Исходный C# → компилятор → IL в сборке → CLR / JIT → машинный код.</p></div><div class="card"><h3>Передача параметров</h3><p class="small">По умолчанию — значение; <code>ref</code> — изменить исходную переменную; <code>out</code> — вернуть значение через параметр; <code>in</code> — по ссылке только для чтения.</p></div><div class="card"><h3>LINQ</h3><p class="small"><code>Where</code> фильтрует; <code>Select</code> преобразует; <code>OrderBy</code> сортирует; <code>GroupBy</code> группирует.</p></div><div class="card"><h3>Файлы</h3><p class="small"><code>File</code> — статические методы; <code>FileInfo</code> — объект файла; <code>FileStream</code> — байты; <code>StreamReader/Writer</code> — текст.</p></div><div class="card"><h3>MVVM</h3><p class="small">Model — данные; View — UI/XAML; ViewModel — свойства и команды. Repository — хранение; Service — операции и правила.</p></div><div class="card"><h3>Тестирование</h3><p class="small">Unit — отдельный модуль; integration — взаимодействие модулей; regression — старые сценарии после изменений; load — поведение под нагрузкой.</p></div></div>`}
