function syllabusView(){return `<div class="lesson-head"><div class="crumb">ОФИЦИАЛЬНЫЙ СПИСОК · ПОДГОТОВКА К АТТЕСТАЦИИ</div><h1 class="lesson-title">☑ Все 37 вопросов зачёта</h1><p class="lesson-subtitle">Список сохранён по порядку из твоего PDF. Отмечай пункты, по которым можешь дать ответ без подсказки. Галочки остаются в браузере.</p><div class="chips"><span class="chip">${state.syllabus.length} / 37 отмечено</span><span class="chip">Материал организован в 8 блоков</span></div></div><div class="card">${examTopics.map((t,i)=>`<label class="syllabus-row"><span class="syllabus-num">${i+1}</span><span><strong>${escapeHtml(t[0])}</strong><small>${escapeHtml(t[2])}</small></span><span><input type="checkbox" data-action="syllabus-check" data-id="${i+1}" ${state.syllabus.includes(i+1)?'checked':''} aria-label="Отметить вопрос ${i+1}"></span></label>`).join('')}<div class="lesson-actions"><button class="btn btn-primary" data-action="start-final">Сдать итоговый тест →</button><button class="btn btn-light" data-action="uncheck-syllabus">Снять все отметки</button></div></div><div class="footnote">Номера и формулировки тем взяты из приложенного PDF «Вопросы для подготовки к экзамену». Краткие подсказки служат ориентирами; для полного ответа изучи соответствующий блок.</div>`}
function finalView(){return `<div class="hero"><div class="hero-inner"><div class="eyebrow">Финальная проверка</div><h2>Проверь, что готов к пересдаче.</h2><p>30 вопросов: по 3 из каждой из 8 лекций и 6 по курсовой; состав случайно перемешивается. После каждого ответа будет объяснение, а итог покажет количество правильных ответов. Рекомендуемый проходной результат для тренировки — 70%.</p><div class="hero-actions"><button class="btn btn-primary" data-action="start-final">Начать итоговый тест →</button><button class="btn btn-secondary" data-nav="mistakes">Сначала повторить ошибки (${Object.keys(state.mistakes).length})</button></div></div></div><div class="grid" style="margin-top:16px"><div class="card"><h3>Что проверяется</h3><p class="muted small">C#, .NET, Console, массивы, циклы, строки, методы, LINQ, делегаты, события, файлы, коллекции, исключения, интерфейсы, тестирование и WPF/MVVM.</p></div><div class="card"><h3>Как получить пользу</h3><p class="muted small">Не угадывай быстро. Перед выбором проговори объяснение, почему остальные варианты не подходят. Повтори ошибки сразу после теста.</p></div><div class="card"><h3>Твой лучший результат</h3><div class="stat-number">${state.best.final?.pct||0}%</div><p class="muted small">${state.best.final?`Правильно ${state.best.final.score} из ${state.best.final.total}`:'Итоговый тест ещё не пройден'}</p></div></div>`}
function quizOriginPage(spec){if(spec.completeKey==='coursework'||blockById(spec.completeKey))return spec.completeKey;if(spec.id==='final')return 'final';if(spec.id==='mistakes')return 'mistakes';if(spec.id==='sprint-coursework'||String(spec.id).startsWith('sprint-'))return 'sprint';return activePage==='quiz'?'home':activePage;}
function startQuiz(spec){const questions=spec.questions.slice();shuffle(questions);const returnPage=quizOriginPage(spec);currentQuiz={...spec,returnPage,questions,index:0,score:0,missed:[],responses:[],answered:false,selected:null,optionOrder:[],reviewOpen:false};lastQuizSpec=spec;activePage='quiz';setTitle('quiz',spec.title);$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===returnPage));$('#sidebar').classList.remove('open');$('#app').innerHTML=quizView();$('#app').scrollIntoView({block:'start',behavior:'smooth'})}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function questionSourceLabel(q,short=false){const b=blocks.find(block=>block.questions.some(item=>item.id===q.id));if(b)return short?`Лекция ${Number(b.number)}`:`Лекция ${b.number} · ${b.title}`;if(courseQuestions.some(item=>item.id===q.id))return short?'Курсовая':'Курсовая · Task Manager';const label=q.topic||'Общий вопрос';return short?label.slice(0,36):label;}
function quizView(){if(!currentQuiz)return '';if(currentQuiz.finished)return resultView();const q=currentQuiz.questions[currentQuiz.index];if(!currentQuiz.optionOrder.length)currentQuiz.optionOrder=shuffle(q.options.map((text,originalIndex)=>({text,originalIndex})));const correctCount=currentQuiz.score;return `<div class="lesson-head"><div class="crumb">${escapeHtml(currentQuiz.title)}</div><h1 class="lesson-title">Тренировка знаний</h1><p class="lesson-subtitle">Выбери ответ. После выбора объяснение появится сразу; правильный ответ будет подсвечен.</p></div><div class="card question-card"><div class="quiz-heading"><h2>Вопрос ${currentQuiz.index+1}</h2><span class="progress-count">${currentQuiz.index+1} / ${currentQuiz.questions.length} · ${correctCount} верно</span></div><div class="quiz-progress"><i style="width:${((currentQuiz.index+(currentQuiz.answered?1:0))/currentQuiz.questions.length)*100}%"></i></div><div class="q-topic">${escapeHtml(questionSourceLabel(q,true))}</div><div class="q-text">${escapeHtml(q.text)}</div><div class="options">${currentQuiz.optionOrder.map((o,i)=>{let cls='';if(currentQuiz.answered&&o.originalIndex===q.correct)cls='correct';if(currentQuiz.answered&&o.originalIndex===currentQuiz.selected&&o.originalIndex!==q.correct)cls='wrong';return `<button class="option ${cls}" data-action="quiz-answer" data-answer="${o.originalIndex}" ${currentQuiz.answered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(o.text)}</span></button>`}).join('')}</div>${currentQuiz.answered?`<div class="feedback ${currentQuiz.selected===q.correct?'good':'bad'}"><strong>${currentQuiz.selected===q.correct?'✓ Верно!':'✕ Не совсем. Правильный ответ: '+escapeHtml(q.options[q.correct])}</strong>${escapeHtml(q.explain)}</div>`:''}<div class="quiz-bottom"><span class="muted">${currentQuiz.answered?'Разбери пояснение перед переходом.':'Не спеши — вспомни правило или пример.'}<br><small>Клавиши: 1–4 — выбрать ответ, Enter — дальше.</small></span>${currentQuiz.answered?`<button class="btn btn-primary" data-action="quiz-next">${currentQuiz.index===currentQuiz.questions.length-1?'Посмотреть результат':'Следующий вопрос →'}</button>`:''}</div></div><div class="footnote">Результат сохраняется локально. Набрав 70% или больше, ты отметишь тематический блок как освоенный.</div>`}
function resultView(){const pct=Math.round(currentQuiz.score/currentQuiz.questions.length*100);const pass=pct>=70;const review=currentQuiz.reviewOpen?`<div class="card" style="margin-top:16px"><h2>Разбор всех ответов</h2><p class="muted small">Пройди по вопросам ещё раз: что выбрал, какой ответ правильный и почему.</p>${currentQuiz.responses.map((r,i)=>`<section class="lesson-section"><div class="q-topic">${escapeHtml(questionSourceLabel(r.question))} · ${r.correct?'Верно':'Ошибка'}</div><h3>${i+1}. ${escapeHtml(r.question.text)}</h3><p style="color:${r.correct?'#328225':'#ab3b46'}"><b>Твой ответ:</b> ${escapeHtml(r.question.options[r.selected])}</p><p style="color:#328225"><b>Правильный ответ:</b> ${escapeHtml(r.question.options[r.question.correct])}</p><p>${escapeHtml(r.question.explain)}</p></section>`).join('')}</div>`:'';return `<div class="card result"><div class="result-emoji">${pct>=90?'🏆':pct>=70?'🎉':'💪'}</div><h2>${pct>=90?'Отличная работа!':pct>=70?'Хороший результат!':'Есть что повторить'}</h2><div class="result-score">${pct}%</div><p>Правильных ответов: ${currentQuiz.score} из ${currentQuiz.questions.length}. ${pass?'Блок засчитан как освоенный. Продолжай в том же духе.':'Для освоения блока постарайся набрать не менее 70%. Посмотри ошибки и попробуй снова.'}</p><div class="result-stats"><div><strong>${currentQuiz.score}</strong><span>верно</span></div><div><strong>${currentQuiz.questions.length-currentQuiz.score}</strong><span>ошибок</span></div><div><strong>+${currentQuiz.awarded||0}</strong><span>XP</span></div></div><div class="lesson-actions" style="justify-content:center"><button class="btn btn-primary" data-action="quiz-retry">Пройти ещё раз</button><button class="btn btn-light" data-action="quiz-review-toggle">${currentQuiz.reviewOpen?'Скрыть разбор ответов':'Разобрать все ответы'}</button>${Object.keys(state.mistakes).length?'<button class="btn btn-light" data-nav="mistakes">Повторить ошибки</button>':''}<button class="btn btn-light" data-action="quiz-return">Вернуться к материалу</button></div></div>${review}` }
function answerQuestion(index){if(!currentQuiz||currentQuiz.answered||currentQuiz.finished)return;const q=currentQuiz.questions[currentQuiz.index];currentQuiz.selected=Number(index);currentQuiz.answered=true;currentQuiz.responses.push({question:q,selected:currentQuiz.selected,correct:currentQuiz.selected===q.correct});if(currentQuiz.selected===q.correct){currentQuiz.score++;delete state.mistakes[q.id]}else{state.mistakes[q.id]={selectedText:q.options[currentQuiz.selected],time:Date.now()};currentQuiz.missed.push(q.id)}saveState();$('#app').innerHTML=quizView()}
function nextQuestion(){if(!currentQuiz||!currentQuiz.answered)return;if(currentQuiz.index<currentQuiz.questions.length-1){currentQuiz.index++;currentQuiz.answered=false;currentQuiz.selected=null;currentQuiz.optionOrder=[];$('#app').innerHTML=quizView();}else{finishQuiz()}}
function finishQuiz(){if(!currentQuiz)return;currentQuiz.finished=true;const pct=Math.round(currentQuiz.score/currentQuiz.questions.length*100);const awarded=currentQuiz.score*5;currentQuiz.awarded=awarded;state.xp+=awarded;state.attempts++;const key=currentQuiz.completeKey||currentQuiz.id;const previous=state.best[key];if(!previous||pct>=previous.pct)state.best[key]={pct,score:currentQuiz.score,total:currentQuiz.questions.length,date:Date.now()};if(currentQuiz.completeKey&&pct>=70&&!state.completed.includes(currentQuiz.completeKey))state.completed.push(currentQuiz.completeKey);saveState();$('#app').innerHTML=quizView();}
function startBlockQuiz(id){const b=blockById(id);if(b)startQuiz({id:b.id,title:`Тест: ${b.title}`,questions:b.questions,completeKey:b.id})}
function startCourseQuiz(){startQuiz({id:'coursework',title:'Тест по курсовой',questions:courseQuestions,completeKey:'coursework'})}
function startFinalQuiz(){const sample=[];blocks.forEach(b=>sample.push(...shuffle(b.questions.slice()).slice(0,3)));sample.push(...shuffle(courseQuestions.slice()).slice(0,6));startQuiz({id:'final',title:'Итоговый тест',questions:shuffle(sample)})}
function startMistakeQuiz(){const ids=Object.keys(state.mistakes);const qs=allQuestions().filter(q=>ids.includes(q.id));if(qs.length)startQuiz({id:'mistakes',title:'Повторение ошибок',questions:qs})}
function renderFilteredFlashcards(query=''){const list=flashcards.filter(f=>f.join(' ').toLowerCase().includes(query.toLowerCase()));$('#flashGrid').innerHTML=list.length?renderFlashcards(list):'<div class="card empty"><div>⌕</div><h3>Ничего не найдено</h3><p>Попробуй другой термин.</p></div>'}
$('#mainNav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)});
$$('.nav button[data-page]').filter(b=>!$('#mainNav').contains(b)).forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#app').addEventListener('input',e=>{if(e.target.id==='flashSearch')renderFilteredFlashcards(e.target.value)});
$('#app').addEventListener('change',e=>{if(e.target.matches('[data-action="syllabus-check"]')){const id=Number(e.target.dataset.id);state.syllabus=e.target.checked?[...new Set([...state.syllabus,id])]:state.syllabus.filter(x=>x!==id);saveState();const box=e.target.closest('.lesson-head');const chips=$$('.chip',box||document);if(chips[0])chips[0].textContent=`${state.syllabus.length} / 37 отмечено`}});
$('#app').addEventListener('click',e=>{
 const el=e.target.closest('[data-action],[data-nav]');if(!el)return;const act=el.dataset.action;const nav=el.dataset.nav;if(nav){navigate(nav);return}
 if(act==='continue'){const notDone=blocks.find(b=>!state.completed.includes(b.id));navigate(notDone?.id||'coursework');return}
 if(act==='start-block-quiz')startBlockQuiz(el.dataset.id);
 else if(act==='start-course-quiz')startCourseQuiz();
 else if(act==='start-final'||act==='start-final-quiz')startFinalQuiz();
 else if(act==='start-mistake-quiz')startMistakeQuiz();
 else if(act==='quiz-answer')answerQuestion(el.dataset.answer);
 else if(act==='quiz-next')nextQuestion();
 else if(act==='quiz-retry'&&lastQuizSpec){if(lastQuizSpec.id==='final')startFinalQuiz();else if(String(lastQuizSpec.id).startsWith('sprint-'))startSprintMiniQuiz(lastQuizSpec.sprintPart);else startQuiz(lastQuizSpec)}
 else if(act==='quiz-review-toggle'&&currentQuiz){currentQuiz.reviewOpen=!currentQuiz.reviewOpen;$('#app').innerHTML=quizView()}
 else if(act==='quiz-return'){navigate(currentQuiz?.returnPage||'home')}
 else if(act==='toc'){const t=document.getElementById(el.dataset.target);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(act==='oral-toggle'){const id=el.dataset.id;const ans=document.getElementById(id);const open=el.closest('.oral').classList.toggle('open');el.querySelector('span:last-child').textContent=open?'−':'＋';}
 else if(act==='oral-timer'){toggleOralTimer(el.dataset.id,el)}
 else if(act==='sprint-toggle'){toggleSprintTimer()}
 else if(act==='sprint-reset'){resetSprintTimer()}
 else if(act==='sprint-open'){const id=el.dataset.id;navigate(id==='coursework'?'coursework':id)}
 else if(act==='sprint-mini-quiz'){startSprintMiniQuiz(el.dataset.id)}
 else if(act==='sprint-mark'){const id=el.dataset.id;state.sprintDone=state.sprintDone.includes(id)?state.sprintDone.filter(x=>x!==id):[...state.sprintDone,id];saveState();renderPage()}
 else if(act==='flash-toggle'){el.classList.toggle('open')}
 else if(act==='uncheck-syllabus'){state.syllabus=[];saveState();renderPage()}
});
document.addEventListener('keydown',e=>{if(activePage!=='quiz'||!currentQuiz||currentQuiz.finished)return;if(e.ctrlKey||e.altKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target?.tagName||''))return;if(!currentQuiz.answered&&/^[1-4]$/.test(e.key)){const option=currentQuiz.optionOrder[Number(e.key)-1];if(option){e.preventDefault();answerQuestion(option.originalIndex)}}else if(currentQuiz.answered&&e.key==='Enter'){e.preventDefault();nextQuestion()}});
function applyTheme(){document.documentElement.dataset.theme=state.theme==='dark'?'dark':'light';const b=$('#themeToggle');if(b)b.textContent=state.theme==='dark'?'☀️ Включить светлую тему':'🌙 Включить тёмную тему'}
function closeTools(){const d=$('#toolsMenu');if(d)d.open=false}
function exportProgress(){const payload={application:'TehProg',version:1,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`tehprog-progress-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);closeTools()}
function importProgressFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result||''));const candidate=parsed&&parsed.state&&typeof parsed.state==='object'?parsed.state:parsed;if(!candidate||typeof candidate!=='object'||!['xp','completed','best','mistakes','syllabus','sprintDone'].some(k=>k in candidate))throw new Error('В файле не найден прогресс ТехПрог.');state={xp:Number(candidate.xp)||0,completed:Array.isArray(candidate.completed)?candidate.completed.filter(v=>typeof v==='string'):[],best:candidate.best&&typeof candidate.best==='object'?candidate.best:{},mistakes:candidate.mistakes&&typeof candidate.mistakes==='object'?candidate.mistakes:{},syllabus:Array.isArray(candidate.syllabus)?candidate.syllabus.filter(v=>Number.isInteger(v)&&v>=1&&v<=37):[],lastBlock:blockById(candidate.lastBlock)?.id||'b1',attempts:Number(candidate.attempts)||0,theme:candidate.theme==='dark'?'dark':'light',sprintDone:Array.isArray(candidate.sprintDone)?candidate.sprintDone.filter(v=>sprintParts.some(p=>p.id===v)):[]};saveState();applyTheme();activePage='home';currentQuiz=null;renderPage();closeTools();alert('Прогресс импортирован.')}catch(err){alert('Не удалось импортировать прогресс: '+(err?.message||'неверный формат JSON'))}};reader.onerror=()=>alert('Не удалось прочитать выбранный файл.');reader.readAsText(file)}
$('#toolsMenu').addEventListener('click',e=>{const b=e.target.closest('[data-global-action]');if(!b)return;const action=b.dataset.globalAction;if(action==='toggle-theme'){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();closeTools()}else if(action==='export-progress')exportProgress();else if(action==='import-progress'){$('#progressFile').click();closeTools()}else if(action==='reset-progress'){closeTools();if(confirm('Сбросить опыт, пройденные блоки, лучшие результаты, ошибки и отметки по темам? Экспортированный файл при этом не удалится.')){const keepTheme=state.theme;state={xp:0,completed:[],best:{},mistakes:{},syllabus:[],lastBlock:'b1',attempts:0,theme:keepTheme,sprintDone:[]};saveState();stopOralTimers();resetSprintTimer();currentQuiz=null;lastQuizSpec=null;activePage='home';setTitle('home');$$('.nav button[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page==='home'));$$('#mainNav button').forEach(x=>x.classList.toggle('active',x.dataset.page==='home'));renderPage()}}});
$('#progressFile').addEventListener('change',e=>{importProgressFile(e.target.files?.[0]);e.target.value='' });
applyTheme();
updateHeader();renderPage();
</script>
